<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda tu Cita - Dentalclean</title>
    <link rel="icon" href="img/Logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background: url('https://images.unsplash.com/photo-1598256989800-fea5c0ebbcbc?q=80&w=2070&auto=format&fit=crop') center/cover fixed;">
    <header>
        <h1><img src="img/Logo.png" alt="Logo">Dentalclean</h1>
        <nav>
            <ul>
                <li><a href="inicio.html">Inicio</a></li>
                <li><a href="informacion.html">Información</a></li>
                <li><a href="reservacion.html" class="active">Reservación</a></li>
                <li><a href="login.html" style="border: 2px solid var(--secondary-color); padding: 5px 15px; border-radius: 8px;">Panel Médico</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <div class="form-container">
            <h2>Agenda tu Cita Especializada</h2>
            <p style="text-align:center; color:#64748b; margin-bottom: 30px;">Completa el formulario para coordinar tu atención.</p>
            
            <form id="formReserva" action="/reservar" method="POST">
                <div class="form-grid">
                    <div class="form-group"><label>Primer Nombre *</label><input type="text" name="primer_nombre" required></div>
                    <div class="form-group"><label>Segundo Nombre</label><input type="text" name="segundo_nombre"></div>
                    <div class="form-group"><label>Primer Apellido *</label><input type="text" name="primer_apellido" required></div>
                    <div class="form-group"><label>Segundo Apellido *</label><input type="text" name="segundo_apellido" required></div>
                    <div class="form-group"><label>Fecha Nacimiento *</label><input type="date" name="fecha_nacimiento" required></div>
                    <div class="form-group"><label>Cédula *</label><input type="text" name="cedula" required placeholder="V-00000000"></div>
                    
                    <div class="form-group full-width">
                        <label>Estatus de Salud Actual *</label>
                        <select name="estatus_salud" required>
                            <option value="">Seleccione su estado actual...</option>
                            <option value="Sano">Me encuentro en perfecto estado de salud</option>
                            <option value="Afeccion Leve">Tengo una afección leve</option>
                            <option value="Enfermedad Cronica">Padezco una enfermedad crónica</option>
                            <option value="Mal estado">Me encuentro mal de salud (Dolor agudo)</option>
                        </select>
                    </div>

                    <div class="form-group"><label>Teléfono Personal *</label><input type="tel" name="telefono_personal" required></div>
                    <div class="form-group"><label>Teléfono Secundario</label><input type="tel" name="telefono_secundario"></div>
                    <div class="form-group"><label>Correo Electrónico *</label><input type="email" name="correo" required></div>
                    <div class="form-group full-width"><label>Dirección de Residencia *</label><input type="text" name="direccion" required></div>
                    
                    <div class="form-group">
                        <label>¿Posee discapacidad? *</label>
                        <select name="discapacidad" onchange="document.getElementById('det_disc').style.display = this.value==='Si' ? 'block' : 'none'">
                            <option value="No">No</option><option value="Si">Sí</option>
                        </select>
                    </div>
                    <div class="form-group" id="det_disc" style="display:none;">
                        <label>Indique la discapacidad</label><input type="text" name="detalle_discapacidad">
                    </div>

                    <div class="form-group full-width"><label>Motivo de la cita *</label><input type="text" name="motivo" required></div>

                    <div class="form-group full-width">
                        <label>¿Por dónde nos conoce? *</label>
                        <select name="conoce_por" required>
                            <option value="">Seleccione una opción...</option>
                            <option value="Recomendacion">Recomendación</option>
                            <option value="Redes Sociales">Redes Sociales</option>
                            <option value="Google Maps">Google Maps</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>

                    <div class="form-group"><label>Fecha *</label><input type="date" name="fecha" id="fecha" required></div>
                    <div class="form-group"><label>Hora (06:35 AM a 06:35 PM) *</label><input type="time" name="hora" id="hora" required></div>

                    <div class="form-group">
                        <label>Tratamiento *</label>
                        <select name="tratamiento" required>
                            <option value="">Seleccione...</option>
                            <option value="Limpieza Dental">Limpieza Dental</option>
                            <option value="Ortodoncia">Ortodoncia</option>
                            <option value="Diseño de Sonrisa">Diseño de Sonrisa</option>
                            <option value="Implantología Estratégica">Implantología Estratégica</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Especialista *</label>
                        <select name="odontologo" required>
                            <option value="Dr. Kevin Da Costa">Dr. Kevin Da Costa</option>
                            <option value="Dr. Nilson Guanipa">Dr. Nilson Guanipa</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 25px;">Confirmar Cita Médica</button>
            </form>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
