<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda tu Cita - Dentalclean</title>
    <link rel="icon" href="img/Logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-inicio">
    <header>
        <h1><img src="img/Logo.png" alt="Logo">Dentalclean</h1>
        <nav>
            <ul>
                <li><a href="inicio.html">Inicio</a></li>
                <li><a href="informacion.html">Información</a></li>
                <li><a href="Precios y servicios.html">Servicios y Precios</a></li>
                <li><a href="reservacion.html" class="active">Reservación</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <div class="form-container">
            <h2>Agenda tu Cita Especializada</h2>
            <p style="text-align:center; color:#64748b; margin-bottom: 30px;">Completa el formulario para coordinar tu atención.</p>
            
            <form id="formReserva" action="/reservar" method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Primer Nombre *</label>
                        <input type="text" name="primer_nombre" minlength="2" maxlength="15" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ]+" placeholder="Ej: Jose" oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑüÜ]/g, '')" required>
                    </div>
                    <div class="form-group">
                        <label>Segundo Nombre</label>
                        <input type="text" name="segundo_nombre" minlength="2" maxlength="15" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ]+" placeholder="Ej: Alberto" oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑüÜ]/g, '')" required>
                    </div>

                    <div class="form-group">
                        <label>Primer Apellido *</label>
                        <input type="text" name="primer_apellido" minlength="2" maxlength="20" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ]+" placeholder="Ej: Ordonez" oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑüÜ]/g, '')" required>
                    </div>
                    <div class="form-group">
                        <label>Segundo Apellido *</label>
                        <input type="text" name="segundo_apellido" minlength="2" maxlength="20" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ]+" placeholder="Ej: Gonzalez" oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑüÜ]/g, '')" required>
                    </div>

                    <div class="form-group">
                        <label>Fecha Nacimiento *</label>
                        <input type="date" name="fecha_nacimiento" id="fecha_naci" required>
                    </div>

                    <div class="form-group">
                        <label>Cédula *</label>
                        <input type="text" inputmode="numeric" name="cedula" placeholder="Ej: 31397398" minlength="7" maxlength="8" pattern="[0-9]{7,8}" oninput="this.value = this.value.replace(/\D/g, '')" required>
                    </div>
                    
                    <div class="form-group full-width">
                        <label>Estatus de Salud Actual *</label>
                        <select name="estatus_salud" required>
                            <option value="">Seleccione su estado actual...</option>
                            <option value="Sano">Me encuentro en perfecto estado de salud</option>
                            <option value="Afeccion Leve">Tengo una afección leve</option>
                            <option value="Enfermedad Cronica">Padezco una enfermedad crónica</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Teléfono Personal *</label>
                        <input type="tel" name="telefono_personal" placeholder="Ej: 04241234567" minlength="11" maxlength="11" pattern="^0[0-9]{10}$" oninput="this.value = this.value.replace(/\D/g, '')" required>
                    </div>
                    <div class="form-group">
                        <label>Teléfono Secundario</label>
                        <input type="tel" name="telefono_secundario" placeholder="Ej: 04127654321" minlength="11" maxlength="11" pattern="^0[0-9]{10}$" oninput="this.value = this.value.replace(/\D/g, '')">
                    </div>

                    <div class="form-group">
                        <label>Correo Electrónico *</label>
                        <input type="email" name="correo" maxlength="60" placeholder="usuario@correo.com" required>
                    </div>

                    <div class="form-group full-width">
                        <label>Dirección de Residencia *</label>
                        <input type="text" name="direccion" minlength="5" maxlength="120" placeholder="Ciudad, Sector, Calle/Avenida, Casa/Apto" oninput="this.value = this.value.replace(/['\<>]/g, '')" required>
                    </div>
                    
                    <div class="form-group">
                        <label>¿Posee discapacidad? *</label>
                        <select name="discapacidad" onchange="document.getElementById('det_disc').style.display = this.value==='Si' ? 'block' : 'none'">
                            <option value="No">No</option><option value="Si">Sí</option>
                        </select>
                    </div>
                    <div class="form-group" id="det_disc" style="display:none;">
                        <label>Indique la discapacidad</label>
                        <input type="text" name="detalle_discapacidad" maxlength="60" oninput="this.value = this.value.replace(/['\<>]/g, '')">
                    </div>

                    <div class="form-group full-width">
                        <label>Motivo de la cita *</label>
                        <input type="text" name="motivo" minlength="5" maxlength="200" placeholder="Ej: Control de ortodoncia / Dolor agudo" oninput="this.value = this.value.replace(/['\<>]/g, '')" required>
                    </div>

                    <div class="form-group full-width">
                        <label>¿Por dónde nos conoce? *</label>
                        <select name="conoce_por" required>
                            <option value="">Seleccione una opción...</option>
                            <option value="Recomendacion">Recomendación</option>
                            <option value="Redes Sociales">Redes Sociales</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Fecha *</label>
                        <input type="date" name="fecha" id="fecha" required>
                    </div>
                    <div class="form-group">
                        <label>Hora (06:35 AM a 06:35 PM) *</label>
                        <input type="time" name="hora" id="hora" min="06:35" max="18:35" required>
                    </div>

                    <div class="form-group">
                        <label>Tratamiento *</label>
                        <select name="tratamiento" required>
                            <option value="">Seleccione...</option>
                            <option value="Implantología 3D">Implantología 3D ($450)</option>
                            <option value="Diseño de Sonrisa Digital">Diseño de Sonrisa Digital ($120)</option>
                            <option value="Ortodoncia Invisible/Fija">Ortodoncia Invisible/Fija ($800)</option>
                            <option value="Odontología General">Odontología General ($45)</option>
                            <option value="Aclaramiento Dental LED">Aclaramiento Dental LED ($60)</option>
                            <option value="Profilaxis Ultrasónica">Profilaxis Ultrasónica ($25)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Especialista *</label>
                        <select name="odontologo" required>
                            <option value="Dr. Jose Miquilena">Dr. Jose Miquilena</option>
                            <option value="Dr. Kevin Da Costa">Dr. Kevin Da Costa</option>
                            <option value="Dr. Nilson Guanipa">Dr. Nilson Guanipa</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 25px;">Confirmar Cita Médica</button>
            </form>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Lógica para Fecha de Nacimiento (Alguien no puede tener 150 años, ni haber nacido mañana)
            const fnac = document.getElementById('fecha_naci');
            if(fnac) {
                const hoy = new Date();
                // Máximo admitido: Alguien de 3 años de edad
                const maxDate = new Date(hoy.getFullYear() - 3, hoy.getMonth(), hoy.getDate()).toISOString().split('T')[0];
                // Mínimo admitido: Alguien de 100 años de edad
                const minDate = new Date(hoy.getFullYear() - 100, hoy.getMonth(), hoy.getDate()).toISOString().split('T')[0];
                fnac.setAttribute('max', maxDate);
                fnac.setAttribute('min', minDate);
            }

            // 2. Lógica para la Cita (Bloquea físicamente en el calendario los días del pasado)
            const fcita = document.getElementById('fecha');
            if(fcita) {
                const todayISO = new Date().toISOString().split('T')[0];
                fcita.setAttribute('min', todayISO);
            }
        });
    </script>

    <script src="app.js"></script>
</body>
</html>
