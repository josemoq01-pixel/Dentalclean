<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de nuevo personal - Dentalclean</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="img/Logo.png">
</head>
<body class="bg-login">
    <div class="glass-container" style="max-width: 550px; margin: 3rem auto;">
        <h2 style="text-align: center; color:var(--secondary-color); margin-bottom: 20px;">Registro de Personal</h2>
        <p style="text-align: center; color:#94a3b8; margin-bottom: 30px;">Requiere clave maestra.</p>

        <form id="registroForm">
            <div style="display:flex; gap:10px;">
                <input type="text" id="nombres" placeholder="Nombres" required>
                <input type="text" id="apellidos" placeholder="Apellidos" required>
            </div>
            
            <input type="number" id="cedula" placeholder="Nro de Cédula de Identidad" required>
            <input type="number" id="telefono" placeholder="Teléfono celular" required>
            
            <select id="cargo" required>
                <option value="" disabled selected>Seleccione la especialidad...</option>
                <option value="Director Médico">Director Médico</option>
                <option value="Odontólogo General">Odontólogo General</option>
                <option value="Cirujano Maxilofacial">Cirujano Maxilofacial</option>
                <option value="Ortodoncista">Ortodoncista</option>
                <option value="Ayudante / Higienista">Ayudante / Higienista</option>
            </select>

            <select id="horario" required>
                <option value="" disabled selected>Asignación de turno operativo...</option>
                <option value="Mañana (6:00 AM - 1:00 PM)">Turno Mañana (6:00 AM - 1:00 PM)</option>
                <option value="Tarde (1:00 PM - 6:00 PM)">Turno Tarde (1:00 PM - 6:00 PM)</option>
            </select>

            <input type="password" id="password" placeholder="Crear contraseña personal de acceso" required>
            
            <div style="border-top:1px solid rgba(255,255,255,0.2); margin:20px 0;"></div>

            <input type="password" id="clave_seguridad" placeholder="🔒 Clave Maestra Dentalclean" required style="border-color:var(--accent-color); background:rgba(230, 57, 70, 0.1);">

            <button type="submit" class="btn" style="width: 100%; margin-top:10px;">Registrar Credencial en la Nube</button>
        </form>

        <p style="text-align: center; margin-top: 20px;">
            <a href="login.html" style="color: #cbd5e1;">Cancelar y regresar al Login</a>
        </p>
    </div>

    <script>
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const claveSeguridad = document.getElementById('clave_seguridad').value;
            
            if(claveSeguridad !== "Dentalclean2026") {
                document.body.innerHTML = `<div style="display:flex; height:100vh; align-items:center; justify-content:center; background:#000;"><h1 style='color:red; font-size:4rem; text-shadow:0 0 20px red;'>🚨 BRECHA DE SEGURIDAD DETECTADA 🚨</h1></div>`;
                return;
            }

            const data = {
                nombres: document.getElementById('nombres').value,
                apellidos: document.getElementById('apellidos').value,
                cedula: document.getElementById('cedula').value,
                telefono: document.getElementById('telefono').value,
                cargo: document.getElementById('cargo').value,
                horario: document.getElementById('horario').value,
                password: document.getElementById('password').value,
            };

            try {
                const response = await fetch('/api/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if(result.success) {
                    alert(`✅ Registro procesado.\n\nTUS CREDENCIALES:\nUsuario asignado: ${result.usuario}\n\nEscríbelo, lo necesitarás para entrar al Core.`);
                    window.location.href = 'login.html';
                } else {
                    alert("Error interno: " + result.error);
                }
            } catch (err) {
                alert("Sin conexión con el servidor Core.");
            }
        });
    </script>
</body>
</html>
