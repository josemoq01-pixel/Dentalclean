<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Database - Dentalclean</title>
    <link rel="icon" href="img/Logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">

    <aside class="admin-sidebar">
        <div class="brand">
            <h2>Dentalclean Core</h2>
            <p style="font-size:0.75rem; color:#64748b;" id="welcome-msg">Conectando...</p>
        </div>
        <button class="menu-btn active" onclick="cambiarTab('reservas', this)">📋 Reservas</button>
        <button class="menu-btn" onclick="cambiarTab('pagos', this)">💳 Pagos</button>
        <button class="menu-btn" onclick="cambiarTab('historial_medico', this)">🗂️ Historial Clínico</button>
        <button class="menu-btn" onclick="cambiarTab('consultas', this)">🩺 Consultas</button>
        <button class="menu-btn" onclick="cambiarTab('reportes', this)">📄 Reportes / Indicaciones</button>
        <button class="menu-btn" onclick="cambiarTab('tratamientos', this)">💲 Tratamientos</button>
        <button class="menu-btn" onclick="cambiarTab('personal_medico_registrado', this)">🧑‍⚕️ Personal Médico</button>
        
        <div style="width:100%; border-top: 1px solid rgba(255,255,255,0.1); margin:10px 0;"></div>
        
        <button class="menu-btn" onclick="cambiarTab('vista_citas_pendientes', this)">👁️ Citas Pendientes</button>
        <button class="menu-btn" onclick="cambiarTab('vista_ingresos_recientes', this)">📊 Ingresos</button>
        <button class="menu-btn" onclick="cambiarTab('vista_rendimiento_medicos', this)">📈 Rendimiento</button>
        
        <div style="margin-top:auto; padding:10px; width: 100%; text-align: center;">
            <button onclick="cerrarSesion()" style="background:transparent; border:1px solid #ef4444; color:#ef4444; width:100%; padding:8px; border-radius:8px; cursor:pointer;">Cerrar Sistema</button>
        </div>
    </aside>

    <main class="admin-main">
        <div class="admin-header">
            <h1 id="titulo-seccion">Reservas</h1>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <span class="bcv-tag" id="bcv-indicator">BCV: Cargando...</span>
                <button id="btn-nuevo" onclick="abrirModal()" class="btn" style="padding: 10px 20px; font-size:0.9rem;">➕ Añadir Registro</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="datos-tabla">
                <thead><tr id="table-head"></tr></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </main>

    <div id="modal-form" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModal()">&times;</span>
            <h3 id="modal-title">Nuevo Registro</h3>
            <div id="modal-body">
                </div>
            <button onclick="guardarRegistro()" class="btn" style="width:100%; margin-top:10px;">💾 Guardar Datos</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
